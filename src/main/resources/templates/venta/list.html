<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; width: 90%; color: #333; }
        h1 { margin: 0 0 1rem; }
        .toolbar { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .toolbar form { display: flex; gap: .5rem; }
        .toolbar input[type=text] { padding: .4rem .6rem; border: 1px solid #ccc; border-radius: 4px; width: 220px; }
        button { padding: .4rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2f6fed; color: #fff; }
        .btn-new { display: inline-block; background: #27ae60; color: #fff; text-decoration: none; padding: .4rem 1rem; border-radius: 4px; font-weight: 600; margin-left: auto; }
        .btn-new:hover { background: #219a52; }
        .btn-edit { display: inline-block; background: #f0ad4e; color: #fff; text-decoration: none; padding: .35rem .7rem; border-radius: 4px; }
        .btn-del { background: #d9534f; color: #fff; }
        .btn-cancel { background: #aaa; color: #fff; text-decoration: none; padding: .4rem 1rem; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: .5rem .6rem; text-align: left; }
        th { background: #f1f1f1; }
        form.inline { display: inline; }
        .detalle-count { background: #e8f0fe; color: #2f6fed; padding: .15rem .5rem; border-radius: 10px; font-size: .8rem; font-weight: 600; }
        .badge { display: inline-block; padding: .25rem .6rem; border-radius: 12px; font-size: .8rem; font-weight: 600; color: #fff; }
        .badge-success { background: #27ae60; }
        .badge-danger { background: #d9534f; }
    </style>
</head>
<body>
<h1>Ventas</h1>
<p><a th:href="@{/}" style="color:#2f6fed;text-decoration:none">← Inicio</a></p>

<div class="toolbar">
    <form th:action="@{/ventas}" method="get">
        <input type="text" name="termino" placeholder="Buscar por fecha, estado, cliente..." th:value="${termino}"/>
        <button type="submit" class="btn-primary">Buscar</button>
        <a class="btn-cancel" th:href="@{/ventas}">Limpiar</a>
    </form>
    <a class="btn-new" th:href="@{/ventas/formulario}">+ Nueva venta</a>
</div>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Tienda</th>
        <th>Cliente</th>
        <th>Vendedor</th>
        <th>Detalles</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${ventas}">
        <td th:text="${v.idVenta}"></td>
        <td th:text="${v.fechaVenta}"></td>
        <td><span th:class="${v.estado.name() == 'Completada'} ? 'badge badge-success' : 'badge badge-danger'" th:text="${v.estado}"></span></td>
        <td th:text="${v.tienda?.descripcion}"></td>
        <td th:text="${v.cliente?.nombre}"></td>
        <td th:text="${v.vendedor != null ? v.vendedor.nombre + ' ' + v.vendedor.apellido : ''}"></td>
        <td><span class="detalle-count" th:text="${v.ventaDetalles != null ? v.ventaDetalles.size() : 0}"></span></td>
        <td>
            <a class="btn-edit" th:href="@{/ventas/formulario(id=${v.idVenta})}">Editar</a>
            <form class="inline" th:action="@{/ventas/cancelar/{id}(id=${v.idVenta})}" method="post"
                  th:attr="onsubmit='return confirm(\'¿Cancelar la venta #' + ${v.idVenta} + '? Se marcará como Cancelada.\')'">
                <button type="submit" class="btn-del">Cancelar</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(ventas)}">
        <td colspan="8" style="text-align:center;color:#888;padding:2rem;">No se encontraron ventas.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
