<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Menú de Tienda</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem auto;
      width: 90%;
      color: #333;
    }

    h1 {
      margin: 0 0 1rem;
    }

    h2 {
      margin: 1.5rem 0 .75rem;
    }

    a.inicio {
      text-decoration: none;
      color: #2f6fed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: .5rem .6rem;
      text-align: left;
    }

    th {
      background: #f1f1f1;
    }

    .vacio {
      color: #888;
    }

    .btn {
      display: inline-block;
      background: #2f6fed;
      color: #fff;
      text-decoration: none;
      padding: .4rem 1rem;
      border-radius: 4px;
      margin-top: .5rem;
    }
  </style>
</head>

<body>
  <p><a class="inicio" th:href="@{/tiendas}">← Volver</a></p>
  <h1>Menú de la tienda</h1>
  <p><strong>Tienda:</strong> <span th:text="${tienda.descripcion}"></span> (<span th:text="${tienda.idTienda}"></span>)
  </p>

  <h2>Vendedores de la tienda</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Edad</th>
        <th>Sexo</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="5" class="vacio" th:if="${#lists.isEmpty(vendedores)}">Sin vendedores.</td>
      </tr>
      <tr th:each="v : ${vendedores}">
        <td th:text="${v.idVendedor}"></td>
        <td th:text="${v.nombre}"></td>
        <td th:text="${v.apellido}"></td>
        <td th:text="${v.edad}"></td>
        <td th:text="${v.sexo}"></td>
      </tr>
    </tbody>
  </table>

  <h2>Ventas de la tienda</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="3" class="vacio" th:if="${#lists.isEmpty(ventas)}">Sin ventas.</td>
      </tr>
      <tr th:each="v : ${ventas}">
        <td th:text="${v.idVenta}"></td>
        <td th:text="${v.fechaVenta}"></td>
        <td th:text="${v.estado}"></td>
      </tr>
    </tbody>
  </table>

  <a class="btn" th:href="@{/vendedores}">Gestionar vendedores</a>
  <a class="btn" th:href="@{/ventas}">Gestionar ventas</a>
</body>

</html>
