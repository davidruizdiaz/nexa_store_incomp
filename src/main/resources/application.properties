spring.application.name=nexa_store

spring.datasource.url=jdbc:postgresql://localhost:5432/nexa_store_db
spring.datasource.username=cambiar
spring.datasource.password=cambiar
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.py.edu.nexa_store=DEBUG

spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
